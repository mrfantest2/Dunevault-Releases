name: Temporary Fantest Band Tools v0.4.0 APK

on:
  push:
    branches:
      - fbt040-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Reconstruct v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat scratch/fbt040/source.b64.part* | base64 -d > /tmp/FantestBandTools-v0.4.0-source.zip
          echo '6ab422f83ce3c6b9148f9664ff5702b0e98560232e9eac329bb75f97c193b8b4  /tmp/FantestBandTools-v0.4.0-source.zip' | sha256sum -c -
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q /tmp/FantestBandTools-v0.4.0-source.zip -d buildsrc
          test -f buildsrc/app/build.gradle
          grep -q "versionName '0.4.0'" buildsrc/app/build.gradle
          grep -q 'versionCode 6' buildsrc/app/build.gradle

      - name: Structural and pure policy tests
        working-directory: buildsrc
        shell: bash
        run: |
          set -euo pipefail
          bash tools/StructureTests.sh
          rm -rf /tmp/fbt-pure
          mkdir -p /tmp/fbt-pure
          javac -d /tmp/fbt-pure \
            app/src/main/java/win/fantest/bandtools/EndpointPolicy.java \
            app/src/main/java/win/fantest/bandtools/DiagnosticHistory.java \
            app/src/main/java/win/fantest/bandtools/CompanionReadiness.java \
            tools/PureTests.java
          java -cp /tmp/fbt-pure win.fantest.bandtools.PureTests

      - name: Unit tests and release APK
        working-directory: buildsrc
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest assembleRelease --stacktrace

      - name: Verify unsigned APK payload
        working-directory: buildsrc
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee FantestBandTools-v0.4.0-badging.txt
          grep -q "package: name='win.fantest.bandtools' versionCode='6' versionName='0.4.0'" FantestBandTools-v0.4.0-badging.txt
          rm -rf /tmp/fbt-apkcheck && mkdir /tmp/fbt-apkcheck
          unzip -q "$APK" 'classes*.dex' -d /tmp/fbt-apkcheck
          grep -aR -m1 'FantestEndpointProbe' /tmp/fbt-apkcheck >/dev/null
          grep -aR -m1 'AppPreferences' /tmp/fbt-apkcheck >/dev/null
          grep -aR -m1 'com/huawei/wearengine' /tmp/fbt-apkcheck >/dev/null || grep -aR -m1 'com.huawei.wearengine' /tmp/fbt-apkcheck >/dev/null
          cp "$APK" FantestBandTools-v0.4.0-unsigned.apk
          sha256sum FantestBandTools-v0.4.0-unsigned.apk | tee FantestBandTools-v0.4.0-unsigned.sha256
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
          test -s apksigner.jar

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: FantestBandTools-v0.4.0-unsigned
          path: |
            buildsrc/FantestBandTools-v0.4.0-unsigned.apk
            buildsrc/FantestBandTools-v0.4.0-unsigned.sha256
            buildsrc/FantestBandTools-v0.4.0-badging.txt
            buildsrc/apksigner.jar
          if-no-files-found: error
          retention-days: 1
