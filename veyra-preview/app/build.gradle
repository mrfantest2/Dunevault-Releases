plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.veyra.preview'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.veyra.preview'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-preview'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
